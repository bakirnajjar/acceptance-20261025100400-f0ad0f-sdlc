{% extends "base.html" %}
{% block title %}Reset request{% endblock %}
{% block content %}
  <h1 id="page-title" tabindex="-1">Reset password</h1>
  {% if error %}
    <p class="notice" id="request-error" role="alert" tabindex="-1">{{ error }} <a href="#identifier">Review email address</a></p>
  {% endif %}
  <form action="{{ url_for('reset_request') }}" method="post"{% if error %} aria-describedby="request-error"{% endif %}>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="identifier">Email address</label>
    <input id="identifier" name="identifier" type="email" autocomplete="email" required{% if error %} aria-describedby="request-error"{% endif %}{% if identifier_invalid %} aria-invalid="true"{% endif %}>
    <button type="submit">Request reset</button>
  </form>
  <p class="footer"><a href="{{ url_for('sign_in') }}">Return to sign in</a></p>
{% endblock %}
