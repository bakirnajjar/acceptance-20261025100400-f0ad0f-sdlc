<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} · Reset demo</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff;
        color: #202020;
        font: 14px/1.3 Arial, Helvetica, sans-serif;
      }
      .card {
        width: min(340px, calc(100% - 32px));
        border: 1px solid #333;
        padding: 19px 34px 5px;
        background: #fff;
      }
      h1 { margin: 0 0 22px; font-size: 24px; line-height: 30px; }
      .field { margin-bottom: 14px; }
      label { display: block; line-height: 18px; }
      input {
        display: block;
        width: 100%;
        height: 36px;
        margin-top: 5px;
        padding: 7px 9px;
        border: 1px solid #888;
        border-radius: 0;
        color: #202020;
        background: #fff;
        font: inherit;
      }
      input::placeholder { color: #666; opacity: 1; }
      a { color: #064eb0; text-decoration: underline; }
      .recovery-link { display: inline-block; margin-top: 8px; line-height: 18px; }
      button {
        display: block;
        width: 100%;
        height: 40px;
        margin-top: 16px;
        border: 1px solid #161616;
        border-radius: 0;
        background: #191919;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:disabled { opacity: .65; cursor: not-allowed; }
      :focus-visible { outline: 3px solid #005fca; outline-offset: 3px; }
      .footer { margin: 12px 0 0; color: #555; line-height: 18px; }
      .notice { margin: 0 0 14px; }
    </style>
  </head>
  <body>
    <main class="card" aria-labelledby="page-title">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
