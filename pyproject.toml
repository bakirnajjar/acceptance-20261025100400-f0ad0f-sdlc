[project]
name = "reset-demo"
version = "0.1.0"
description = "Local synthetic Flask/Jinja demo foundation"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1,<4",
]

[project.scripts]
reset-demo = "reset_demo:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.13,<1",
]

[tool.ruff]
target-version = "py312"
